// ================= rules (play money) =================

const CLAIM_CD = 10 * 60 * 1000, CLAIM_FEE = 0.05;
const POOL0 = { purr: 100000, usdt: 10000 }, SWAP_FEE = 0.003;
const ITEMS = {
  wood:    { name: 'Gỗ', price: 8, icon: [4, 0] },
  stone:   { name: 'Đá', price: 12, icon: [4, 1] },
  wheat:   { name: 'Hạt lúa mì', price: 6, icon: [0, 6] },
  turnip:  { name: 'Hạt củ cải', price: 10, icon: [8, 3] },
  garlic:  { name: 'Hạt tỏi', price: 18, icon: [8, 7] },
  corn:    { name: 'Hạt ngô', price: 30, icon: [8, 1] },
  pumpkin: { name: 'Hạt bí ngô', price: 60, icon: [8, 5] },
};
const CROPS = {   // stages: [col, bottom row, height] on the objects sheet
  wheat:   { name: 'Lúa mì', grow: 1 * 60e3,  yield: 9,   icon: [0, 7], stages: [[1, 7, 1], [2, 7, 1], [3, 7, 1], [5, 7, 2], [7, 7, 2]] },
  turnip:  { name: 'Củ cải', grow: 2 * 60e3,  yield: 16,  icon: [9, 3], stages: [[10, 3, 1], [11, 3, 1], [12, 3, 1], [13, 3, 1], [14, 3, 2]] },
  garlic:  { name: 'Tỏi',    grow: 4 * 60e3,  yield: 30,  icon: [9, 7], stages: [[10, 7, 1], [11, 7, 1], [12, 7, 1], [13, 7, 1], [14, 7, 2]] },
  corn:    { name: 'Ngô',    grow: 8 * 60e3,  yield: 52,  icon: [9, 1], stages: [[10, 1, 1], [11, 1, 1], [12, 1, 1], [14, 1, 2], [15, 1, 2]] },
  pumpkin: { name: 'Bí ngô', grow: 15 * 60e3, yield: 105, icon: [9, 5], stages: [[10, 5, 1], [11, 5, 1], [12, 5, 1], [14, 5, 2], [15, 5, 2]] },
};
const FIELD = [null,            // rice fields: regrow forever and mine PURR by the hour
  { name: 'Đồng cỏ non',   rate: 30,  cost: { wood: 10, stone: 8 } },
  { name: 'Đồng lúa xanh', rate: 60,  cost: { wood: 20, stone: 16 } },
  { name: 'Đồng lúa vàng', rate: 100, cost: { wood: 40, stone: 30 } },
];
const IC = { purr: [0, 7], basket: [5, 2], bag: [4, 2], shovel: [1, 5], scythe: [0, 4], hoe: [1, 4], axe: [3, 5], can: [4, 3], rock: [4, 1], stick: [4, 0], pick: [2, 4] };

// ================= state =================
let db = null, user = null, me = null, canWrite = null, signedIn = null;
let land = {}, farms = {}, pool = null, names = {}, colors = {};
let sel = null, busy = false, hover = null;
const ui = { win: null, seed: 'wheat', toast: null, toastAt: 0 };
const fmt = (n, d = 1) => Number(n).toLocaleString('vi-VN', { minimumFractionDigits: d, maximumFractionDigits: d });
const mins = (ms) => { const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const key = (x, y) => x + '_' + y;
const clone = (o) => JSON.parse(JSON.stringify(o));
function toast(m) { ui.toast = m; ui.toastAt = performance.now(); }
const myFarm = () => (me && farms[me]) || null;
const soldCount = () => Object.keys(land).length;
const landPrice = () => LAND_BASE + LAND_STEP * soldCount();
const price = () => { const p = pool || POOL0; return p.usdt / p.purr; };
function fieldRate(f) { let r = 0; for (const p of Object.values(f.plots || {})) if (p.kind === 'house') r += FIELD[p.level].rate; return r; }
function pendingNow(f, now = Date.now()) { return (f.pending || 0) + fieldRate(f) * Math.max(0, now - (f.accrueAt || now)) / 3600e3; }
function accrued(f) { const g = clone(f), now = Date.now(); g.pending = pendingNow(f, now); g.accrueAt = now; g.inv = g.inv || {}; g.plots = g.plots || {}; return g; }
const hasCost = (f, c) => ((f.inv || {}).wood || 0) >= c.wood && ((f.inv || {}).stone || 0) >= c.stone;

const sheetsReady = Promise.all(Object.values(SHEET).map((im) => (im.decode ? im.decode() : new Promise((ok) => (im.onload = ok)))));
function tile(g, sheet, c, r, x, y, h = 1, s = 1) { g.drawImage(SHEET[sheet], c * 16, (r - h + 1) * 16, 16, 16 * h, Math.round(x), Math.round(y - (h - 1) * 16 * s), 16 * s, 16 * h * s); }

// ================= world =================
const TS = 16, MW = 128, MH = 96, WPXW = MW * TS, WPXH = MH * TS, LT = 6, LPX = LT * TS, EDGE = 3;
function hash(a, b, c = 0) { let h = (a * 374761393 + b * 668265263 + c * 2147483647) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function vnoise(x, y, s, seed) {
  const gx = x / s, gy = y / s, x0 = Math.floor(gx), y0 = Math.floor(gy), fx = gx - x0, fy = gy - y0;
  const sm = (t) => t * t * (3 - 2 * t), a = hash(x0, y0, seed), b = hash(x0 + 1, y0, seed), c = hash(x0, y0 + 1, seed), d = hash(x0 + 1, y0 + 1, seed);
  const top = a + (b - a) * sm(fx), bot = c + (d - c) * sm(fx); return top + (bot - top) * sm(fy);
}
const GROUND = new Uint8Array(MW * MH), USED = new Uint8Array(MW * MH);
const at = (x, y) => y * MW + x, inMap = (x, y) => x >= 0 && y >= 0 && x < MW && y < MH;

    } else if (p.kind === 'house') {

    }
  }
  if (!signedIn) btns = [];

  const h = rows.length * lh + btns.length * (bh + S * 2) + pad * 2 + T * .4;

}
function windowFrame(title, w, h) {

function drawWindow() {

    text(`Giá  $${fmt(price(), 4)}`, x, y, { color: '#ffe08a' });
    text(`Pool ${fmt(p.purr, 0)} PURR · ${fmt(p.usdt, 0)} USDT`, x, y + lh);
    // price line over the recent trades

    if (hs.length > 1) { const lo = Math.min(...hs), hi = Math.max(...hs), sp = hi - lo || hi * .01; cx.fillStyle = hs[hs.length - 1] >= hs[0] ? '#8fe08a' : '#ff8a8a'; hs.forEach((v, i) => { const px = x + i / (hs.length - 1) * (w - S * 2), py = gy + gh - (v - lo) / sp * gh; cx.fillRect(Math.round(px), Math.round(py), S * 2, S * 2); }); }
    else text('Biểu đồ hiện ra sau vài lượt giao dịch.', x, gy + gh / 3, { size: Math.round(F * .85) });
    const by = gy + gh + S * 8, cols = 4, bw = (w - S * 2 * (cols - 1)) / cols;
    text('Bán PURR', x, by); ['10', '100', '1000', 'Hết'].forEach((v, i) => button(x + i * (bw + S * 2), by + lh, bw, bh, v, () => swap('sell', v === 'Hết' ? (f ? f.purr : 0) : +v), { enabled: !!f && f.purr > 0 }));
    text('Mua PURR bằng USDT', x, by + lh + bh + S * 6); ['1', '10', '50', 'Hết'].forEach((v, i) => button(x + i * (bw + S * 2), by + 2 * lh + bh + S * 6, bw, bh, v === 'Hết' ? v : '$' + v, () => swap('buy', v === 'Hết' ? (f ? f.usdt : 0) : +v), { enabled: !!f && f.usdt > 0 }));
  }

    const [x, y, w] = windowFrame('Bảng nông dân', 12 * T, Math.max(4, rows.length + 2) * lh + T * 2.2);

    rows.forEach(([id, e, n], i) => { const c = id === me ? '#ffe08a' : '#fbefd5'; text(`${i + 1}. ${id === me ? 'Bạn' : (names[id] || 'Nông dân')} · ${n} lô`, x, y + i * lh, { color: c }); text(fmt(e, 0), x + w, y + i * lh, { align: 'right', color: c }); });
  }

    const [x, y] = windowFrame('Cách chơi', 15 * T, tips.length * lh + T * 2.2);

}
function drawModal() {
  let msg = null, btn = null;
  if (signedIn === false) msg = ['Đăng nhập Claude để chơi.', 'Bạn vẫn xem được bản đồ chung.'];
  else if (signedIn && canWrite === false) msg = ['Bạn đang ở quyền chỉ xem.', 'Nhờ chủ trang cấp quyền Contributor.'];
  else if (signedIn && me && !myFarm()) { msg = ['Chào nông dân mới!', `Nhận ${START.purr} PURR và ${START.usdt} USDT để bắt đầu.`]; btn = ['Nhận gói khởi đầu', actions.start]; }
  if (!msg) return;
  const lh = F + S * 2, w = Math.min(vw - S * 8, Math.max(...msg.map((m) => tw(m))) + S * 24), h = msg.length * lh + (btn ? T + S * 10 : 0) + S * 16;
  const x = vw / 2 - w / 2, y = S * 4 + (vh < 600 ? T * 4 : T * 3.2);
  panel(x, y, w, h);
  msg.forEach((m, i) => text(m, vw / 2, y + S * 8 + i * lh, { align: 'center', color: i ? '#fbefd5' : '#ffe08a' }));

function drawToast(now) {

  const w = Math.min(vw - S * 8, tw(ui.toast) + S * 20), h = F + S * 16;
  panel(vw / 2 - w / 2, vh * .18, w, h);
  text(ui.toast, vw / 2, vh * .18 + (h - F) / 2 - S, { align: 'center' });
}

// ================= frame =================
const mouse = { x: -1, y: -1, down: false };
const keys = new Set();
function frame(nowP) {
  if (fly) { const k = Math.min(1, (nowP - fly.t0) / 600), e = 1 - Math.pow(1 - k, 3); cam.x = fly.x0 + (fly.x - fly.x0) * e; cam.y = fly.y0 + (fly.y - fly.y0) * e; cam.z = fly.z0 + (fly.z - fly.z0) * e; clampCam(); if (k >= 1) fly = null; }
  if (keys.size) { const sp = 16 / cam.z * (keys.has('Shift') ? 2.2 : 1); if (keys.has('a') || keys.has('ArrowLeft')) cam.x -= sp; if (keys.has('d') || keys.has('ArrowRight')) cam.x += sp; if (keys.has('w') || keys.has('ArrowUp')) cam.y -= sp; if (keys.has('s') || keys.has('ArrowDown')) cam.y += sp; clampCam(); }
  const now = Date.now(), sw = vw / cam.z, sh = vh / cam.z, L = cam.x - sw / 2, Tp = cam.y - sh / 2;
  hits = []; blocks = [];
  cx.setTransform(dpr, 0, 0, dpr, 0, 0); cx.imageSmoothingEnabled = false;
  cx.fillStyle = '#2a6b3a'; cx.fillRect(0, 0, vw, vh);
  if (ready) {
    cx.drawImage(world, L, Tp, sw, sh, 0, 0, vw, vh);
    cx.setTransform(dpr * cam.z, 0, 0, dpr * cam.z, -L * cam.z * dpr, -Tp * cam.z * dpr);
    for (const [x, y] of PLOTS) { const X = x * TS, Y = y * TS; if (X + LPX < L || X > L + sw || Y + LPX < Tp - 16 || Y > Tp + sh) continue; drawLot(cx, key(x, y), now); }
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const box = (k, col, w) => { const [x, y] = k.split('_').map(Number), sx = (x * TS - cam.x) * cam.z + vw / 2, sy = (y * TS - cam.y) * cam.z + vh / 2, s = LPX * cam.z; cx.strokeStyle = col; cx.lineWidth = w; cx.strokeRect(sx + w / 2, sy + w / 2, s - w, s - w); };
    if (hover && hover !== sel) box(hover, 'rgba(255,246,200,.8)', 2);
    if (sel) { box(sel, '#2b1d14', 5); box(sel, Math.floor(nowP / 380) % 2 ? '#fff6c8' : '#f2c14e', 3); }
    drawHUD(now); drawLotCard(now); drawModal(); drawWindow(); drawToast(nowP);
  }

}

// ================= input =================
const ptrs = new Map(); let drag = null, pinch = null, uiDrag = null;
const inside = (r, x, y) => x >= r[0] && y >= r[1] && x < r[0] + r[2] && y < r[1] + r[3];
function hitAt(x, y) { for (let i = hits.length - 1; i >= 0; i--) { const h = hits[i]; if (x >= h.x && y >= h.y && x < h.x + h.w && y < h.y + h.h) return h; } return null; }
cv.addEventListener('pointerdown', (e) => {
  const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  cv.setPointerCapture(e.pointerId); mouse.x = x; mouse.y = y; mouse.down = true; fly = null;
  const h = hitAt(x, y);
  if (h && h.drag) { uiDrag = h; h.fn({ x, y }); return; }
  if (h || blocks.some((b) => inside(b, x, y))) { drag = null; return; }
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 1) drag = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y, moved: false };
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: cam.z }; drag = null; }
});
cv.addEventListener('pointermove', (e) => {
  const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top; mouse.x = x; mouse.y = y;
  if (uiDrag) { uiDrag.fn({ x, y }); return; }
  if (ptrs.has(e.pointerId)) ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && ptrs.size === 2) { const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y); zoomAt(pinch.z * d / pinch.d / cam.z, (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top); return; }
  if (drag) { const dx = e.clientX - drag.x, dy = e.clientY - drag.y; if (Math.abs(dx) + Math.abs(dy) > 6) drag.moved = true; if (drag.moved) { cam.x = drag.cx - dx / cam.z; cam.y = drag.cy - dy / cam.z; clampCam(); cv.style.cursor = 'grabbing'; } }
  const overUI = hitAt(x, y) || blocks.some((b) => inside(b, x, y));
  hover = !overUI && e.pointerType === 'mouse' ? lotOfPx(...toWorld(x, y)) : null;
  cv.style.cursor = drag && drag.moved ? 'grabbing' : hitAt(x, y) && hitAt(x, y).fn ? 'pointer' : overUI ? 'default' : 'grab';
});
function endPtr(e) {
  const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top; mouse.down = false;
  if (uiDrag) { uiDrag = null; return; }
  if (!ptrs.has(e.pointerId)) { const h = hitAt(x, y); if (h && h.fn && !h.drag && e.type === 'pointerup') h.fn({ x, y }); return; }
  if (drag && !drag.moved && ptrs.size === 1 && e.type === 'pointerup') { sel = lotOfPx(...toWorld(x, y)); if (sel) ui.win = null; }
  ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null; if (!ptrs.size) drag = null; cv.style.cursor = 'grab';
}
cv.addEventListener('pointerup', endPtr); cv.addEventListener('pointercancel', endPtr);
cv.addEventListener('pointerleave', () => { hover = null; mouse.x = mouse.y = -1; });
cv.addEventListener('wheel', (e) => { e.preventDefault(); fly = null; const r = cv.getBoundingClientRect(); zoomAt(Math.exp(-e.deltaY * .0016), e.clientX - r.left, e.clientY - r.top); }, { passive: false });
const MOVE = ['w', 'a', 's', 'd', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Shift'];
window.addEventListener('keydown', (e) => { const k = e.key.length === 1 ? e.key.toLowerCase() : e.key; if (MOVE.includes(k)) { keys.add(k); fly = null; if (k.startsWith('Arrow')) e.preventDefault(); } if (k === '+' || k === '=') zoomAt(1.25, vw / 2, vh / 2); if (k === '-') zoomAt(.8, vw / 2, vh / 2); if (k === 'Escape') { sel = null; ui.win = null; } });
window.addEventListener('keyup', (e) => keys.delete(e.key.length === 1 ? e.key.toLowerCase() : e.key));
window.addEventListener('blur', () => keys.clear());

// ================= actions (shared database) =================
function swapOut(rin, rout, amt) { const a = amt * (1 - SWAP_FEE); return rout * a / (rin + a); }
async function saveFarm(f) { await db.doc('farms/' + me).set(f); farms[me] = f; }
const fail = (m) => { const e = new Error(m); e.userMsg = m; throw e; };
async function act(fn) {
  if (busy) return;
  if (!db || !me) { toast('Đăng nhập để chơi.'); return; }
  busy = true;
  try { await fn(); } catch (e) { toast(e && e.userMsg ? e.userMsg : 'Không lưu được. Thử lại sau giây lát.'); console.error(e); }
  busy = false;
}
async function lease(ref) { for (let i = 0; i < 6; i++) { const r = await ref.acquire({ holder: me, ttlMs: 4000 }); if (r.acquired) return; await new Promise((ok) => setTimeout(ok, 400 + Math.random() * 400)); } fail('Đang có người giao dịch, thử lại sau.'); }
const actions = {
  start: () => act(async () => { const now = Date.now(); await saveFarm({ purr: START.purr, usdt: START.usdt, pending: 0, accrueAt: now, lastClaim: 0, earned: 0, inv: {}, plots: {}, createdAt: now }); toast('Đã nhận gói khởi đầu. Bấm một lô có 4 cọc gỗ.'); }),
  buyLand: () => act(async () => {
    const k = sel, pr = landPrice(), f = accrued(myFarm());
    if (!(k in PLOT_INDEX)) fail('Lô này không bán.');
    if (f.purr < pr) fail('Không đủ PURR.');
    const ref = db.doc('land/' + k); await lease(ref);
    const cur = await ref.get(); if (cur.exists && cur.data().owner) fail('Lô này vừa có người mua.');
    await ref.set({ owner: me, at: Date.now() }); land[k] = { owner: me };
    f.purr -= pr; f.plots[k] = { kind: 'empty' }; await saveFarm(f); toast('Đã mua lô #' + lotNo(k) + ' giá ' + fmt(pr, 0) + ' PURR.');
  }),
  buy: (d) => act(async () => { const it = ITEMS[d.item], q = +d.qty, f = accrued(myFarm()); if (f.purr < it.price * q) fail('Không đủ PURR.'); f.purr -= it.price * q; f.inv[d.item] = (f.inv[d.item] || 0) + q; await saveFarm(f); toast(`+${q} ${it.name}`); }),
  build: () => act(async () => { const f = accrued(myFarm()), c = FIELD[1].cost; if (!hasCost(f, c)) fail('Thiếu gỗ hoặc đá.'); f.inv.wood -= c.wood; f.inv.stone -= c.stone; f.plots[sel] = { kind: 'house', level: 1 }; await saveFarm(f); toast('Đã lập đồng lúa.'); }),
  upgrade: () => act(async () => { const f = accrued(myFarm()), p = f.plots[sel], c = FIELD[p.level + 1].cost; if (!hasCost(f, c)) fail('Thiếu gỗ hoặc đá.'); f.inv.wood -= c.wood; f.inv.stone -= c.stone; p.level += 1; await saveFarm(f); toast('Đã nâng lên ' + FIELD[p.level].name + '.'); }),
  plant: (d) => act(async () => { const f = accrued(myFarm()); if (!(f.inv[d.crop] > 0)) fail('Hết hạt giống.'); f.inv[d.crop] -= 1; f.plots[sel] = { kind: 'crop', crop: d.crop, plantedAt: Date.now() }; await saveFarm(f); }),
  harvest: () => act(async () => { const f = accrued(myFarm()), p = f.plots[sel], c = CROPS[p.crop]; if (Date.now() - p.plantedAt < c.grow) fail('Chưa chín.'); f.pending += c.yield; f.plots[sel] = { kind: 'empty' }; await saveFarm(f); toast('+' + c.yield + ' PURR vào giỏ.'); }),
  claim: () => act(async () => { const f = accrued(myFarm()), now = Date.now(); if (now - (f.lastClaim || 0) < CLAIM_CD) fail('Chưa đến giờ claim.'); if (f.pending < .01) fail('Giỏ đang trống.'); const got = f.pending * (1 - CLAIM_FEE); f.purr += got; f.earned = (f.earned || 0) + got; f.pending = 0; f.lastClaim = now; await saveFarm(f); toast('Đã claim ' + fmt(got, 2) + ' PURR.'); }),
};
function swap(dir, v) {
  v = Math.floor(v * 100) / 100; if (!(v > 0)) return;
  return act(async () => {
    const f = accrued(myFarm());
    if (dir === 'sell' && f.purr < v) fail('Không đủ PURR.'); if (dir === 'buy' && f.usdt < v) fail('Không đủ USDT.');
    const ref = db.doc('market/pool'); await lease(ref);
    const s = await ref.get(), p = s.exists ? clone(s.data()) : { ...POOL0, hist: [] }; let out;
    if (dir === 'sell') { out = swapOut(p.purr, p.usdt, v); p.purr += v; p.usdt -= out; f.purr -= v; f.usdt += out; }
    else { out = swapOut(p.usdt, p.purr, v); p.usdt += v; p.purr -= out; f.usdt -= v; f.purr += out; }
    p.hist = [...(p.hist || []), { t: Date.now(), p: p.usdt / p.purr }].slice(-60);
    await ref.set(p); pool = p; await saveFarm(f);
    toast(dir === 'sell' ? `Bán ${fmt(v, 2)} PURR → ${fmt(out, 2)} USDT` : `Mua ${fmt(out, 2)} PURR bằng ${fmt(v, 2)} USDT`);
  });
}

// ================= boot =================
let ready = false;
new ResizeObserver(resize).observe(cv); resize();
requestAnimationFrame(frame);
sheetsReady.then(() => { paintWorld(); ready = true; cam.z = 3; clampCam(); });
(async () => {
  if (!window.claude) { signedIn = false; return; }
  [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
  if (user) { me = await user.id(); canWrite = await user.can('data.write'); }
  signedIn = !!(db && me); if (!signedIn) { db = null; return; }
  const refreshNames = async () => { const ids = Object.keys(farms); if (!user || !ids.length) return; try { const ps = await user.profiles(ids); for (const id of ids) { names[id] = ps[id].name; colors[id] = ps[id].color; } } catch (e) {} };
  db.collection('land').onSnapshot((s) => { const n = {}; s.docs.forEach((d) => { const v = d.data(); if (v && v.owner) n[d.id] = v; }); land = n; }, (e) => console.error(e));
  db.collection('farms').onSnapshot((s) => { const n = {}; s.docs.forEach((d) => (n[d.id] = d.data())); farms = n; refreshNames(); }, (e) => console.error(e));
  db.doc('market/pool').onSnapshot((s) => { pool = s.exists ? s.data() : null; }, (e) => console.error(e));
})();
