'use strict';
// ================= rules (play money) =================
const START = { purr: 500, usdt: 100 };
const LAND_BASE = 100, LAND_STEP = 4;
const CLAIM_CD = 10 * 60 * 1000, CLAIM_FEE = 0.05;
const POOL0 = { purr: 100000, usdt: 10000 }, SWAP_FEE = 0.003;
// crops: row on the Spring Crops sheet; stages are columns 0-5, the harvested item is column 7
const CROPS = {
  strawberry:  { name: 'Strawberry',  row: 1,  grow: 1 * 60e3,  yield: 9,   seed: 6 },
  carrot:      { name: 'Carrot',   row: 9,  grow: 2 * 60e3,  yield: 16,  seed: 10 },
  potato:      { name: 'Potato', row: 5, grow: 4 * 60e3,  yield: 30,  seed: 18 },
  cabbage:     { name: 'Cabbage',  row: 15, grow: 8 * 60e3,  yield: 52,  seed: 30 },
  cauliflower: { name: 'Cauliflower',   row: 17, grow: 15 * 60e3, yield: 105, seed: 60 },
};
const MATS = { wood: { name: 'Wood', price: 8 }, stone: { name: 'Stone', price: 12 } };
const HOUSE = [null,
  { name: 'Cottage',   rate: 30,  cost: { wood: 10, stone: 8 },  time: 2 * 60e3,  spr: 'house1' },
  { name: 'Farmhouse', rate: 60,  cost: { wood: 20, stone: 16 }, time: 5 * 60e3,  spr: 'house2' },
  { name: 'Manor',     rate: 100, cost: { wood: 40, stone: 30 }, time: 10 * 60e3, spr: 'house3' },
];

// ================= state =================
let db = null, user = null, me = null, canWrite = null, signedIn = null;
let land = {}, farms = {}, pool = null, names = {};
let sel = null, busy = false, hover = null;
const ui = { win: null, bplot: null, seed: 'strawberry', toast: null, toastAt: 0, title: true };
const fmt = (n, d = 1) => Number(n).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const mins = (ms) => { const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const key = (x, y) => x + '_' + y;
const clone = (o) => JSON.parse(JSON.stringify(o));
function toast(m) { ui.toast = m; ui.toastAt = performance.now(); }
const myFarm = () => (me && farms[me]) || null;
const soldCount = () => Object.keys(land).length;
const landPrice = () => LAND_BASE + LAND_STEP * soldCount();
const price = () => { const p = pool || POOL0; return p.usdt / p.purr; };
const building = (p, now = Date.now()) => !!p && p.kind === 'house' && !!p.doneAt && now < p.doneAt;
const lvlAt = (p, t) => (building(p, t) ? p.prev || 0 : p.level);
function houseRate(f, now = Date.now()) { let r = 0; for (const p of Object.values(f.plots || {})) if (p.kind === 'house' && lvlAt(p, now)) r += HOUSE[lvlAt(p, now)].rate; return r; }
function pendingNow(f, now = Date.now()) {
  const a = Math.min(now, f.accrueAt || now); let e = 0;
  for (const p of Object.values(f.plots || {})) {
    if (p.kind !== 'house') continue;
    const d = p.doneAt || 0, r0 = p.prev ? HOUSE[p.prev].rate : 0, r1 = HOUSE[p.level].rate;
    e += now <= d ? r0 * (now - a) : a >= d ? r1 * (now - a) : r0 * (d - a) + r1 * (now - d);
  }
  return (f.pending || 0) + e / 3600e3;
}
const myPlots = () => Object.keys(land).filter((k) => land[k].owner === me).sort((a, b) => PLOT_INDEX[a] - PLOT_INDEX[b]);
function buildTarget() { const ks = myPlots(); return ks.includes(ui.bplot) ? ui.bplot : ks.includes(sel) ? sel : ks.find((k) => { const p = (myFarm() || {}).plots?.[k]; return !p || p.kind === 'empty'; }) || ks[0] || null; }
const missing = (f, c) => ({ wood: Math.max(0, c.wood - ((f.inv || {}).wood || 0)), stone: Math.max(0, c.stone - ((f.inv || {}).stone || 0)) });
const missingCost = (m) => m.wood * MATS.wood.price + m.stone * MATS.stone.price;
function openBuild(k) { ui.bplot = k || null; ui.win = 'build'; }
function accrued(f) { const g = clone(f), now = Date.now(); g.pending = pendingNow(f, now); g.accrueAt = now; g.inv = g.inv || {}; g.plots = g.plots || {}; return g; }
const hasCost = (f, c) => ((f.inv || {}).wood || 0) >= c.wood && ((f.inv || {}).stone || 0) >= c.stone;

    text('Sell PURR', x, by); ['10', '100', '1000', 'Max'].forEach((v, i) => button(x + i * (bw + S * 2), by + lh, bw, bh, v, () => swap('sell', v === 'Max' ? (f ? f.purr : 0) : +v), { enabled: !!f && f.purr > 0 }));
    text('Buy PURR with USDT', x, by + lh + bh + S * 6); ['1', '10', '50', 'Max'].forEach((v, i) => button(x + i * (bw + S * 2), by + 2 * lh + bh + S * 6, bw, bh, v === 'Max' ? v : '$' + v, () => swap('buy', v === 'Max' ? (f ? f.usdt : 0) : +v), { enabled: !!f && f.usdt > 0, go: true }));
  }
  if (ui.win === 'board') {
    const ids = Object.keys(farms), rows = ids.map((id) => [id, farms[id].earned || 0, Object.keys(farms[id].plots || {}).length]).sort((a, b) => b[1] - a[1]).slice(0, 10);
    const [x, y, w] = windowFrame('Leaderboard', 13 * 16 * S, Math.max(4, rows.length + 2) * lh + 16 * S * 2.4);
    if (!rows.length) text('No farmers yet.', x, y);
    rows.forEach(([id, e, n], i) => { const c = id === me ? '#a2401f' : '#4a2a17'; text(`${i + 1}. ${id === me ? 'You' : (names[id] || 'Farmer')} · ${n} plots`, x, y + i * lh, { color: c }); text(fmt(e, 0), x + w, y + i * lh, { align: 'right', color: c }); });
  }
  if (ui.win === 'help') {
    const tips = ['Walk with WASD or the arrow keys, or tap where to go.', 'Drag to look around. Scroll or pinch to zoom.', 'Tap a plot with a wooden sign to buy it with PURR.', 'Buy seeds, wood and stone in the Shop.', 'Pick a seed in the bar, tap your plot, then Plant.', 'Harvest ripe crops. PURR goes to your storage.', 'Build houses on your plots. They mine PURR every hour.', 'Open Build to construct or upgrade. It takes a few minutes.', 'Claim storage to your wallet every 10 min (5% fee).', 'PURR and USDT here are play money for testing.', 'Art: Farm RPG Tiny Asset Pack by EmanuelleDev.'];
    const [x, y] = windowFrame('How to play', 17 * 16 * S, tips.length * lh + 16 * S * 2.4);
    tips.forEach((t, i) => text(t, x, y + i * lh, { size: Math.round(F * .9) }));
  }
}
function drawModal() {
  let msg = null, btn = null;
  if (signedIn === false) msg = ['Sign in to Claude to play.', 'You can still walk around the village.'];
  else if (signedIn && canWrite === false) msg = ['You have view-only access.', 'Ask the owner for Contributor access.'];
  else if (signedIn && me && !myFarm()) { msg = ['Welcome, new farmer!', `Claim ${START.purr} PURR and ${START.usdt} USDT to get started.`]; btn = ['Claim starter pack', actions.start]; }
  if (!msg) return;
  const lh = F + S * 2, w = Math.min(vw - S * 8, Math.max(...msg.map((m) => tw(m))) + S * 28), h = msg.length * lh + (btn ? 16 * S + S * 12 : 0) + S * 20;
  const x = vw / 2 - w / 2, y = vh * .16;
  panel(x, y, w, h);
  msg.forEach((m, i) => text(m, vw / 2, y + S * 10 + i * lh, { align: 'center', color: i ? '#4a2a17' : '#a2401f' }));
  if (btn) button(x + S * 10, y + S * 10 + msg.length * lh, w - S * 20, 16 * S + S * 4, btn[0], btn[1], { go: true });
}
function drawTitle(t) {
  cx.fillStyle = 'rgba(30,18,10,.45)'; cx.fillRect(0, 0, vw, vh); blocks.push([0, 0, vw, vh]); hits.push({ x: 0, y: 0, w: vw, h: vh, fn: null });
  const maxW = vw - S * 8, pad = S * 12;
  let big = Math.round(F * 2.6); while (big > F && tw('PURRL VALLEY', big) + pad * 2 > maxW) big -= 2;
  const sub = 'A cozy pixel farming village', subSize = tw(sub) + pad * 2 > maxW ? Math.round(F * .8) : F;
  const bh = 16 * S + S * 6, w = Math.min(maxW, Math.max(tw('PURRL VALLEY', big), tw(sub, subSize)) + pad * 2);
  const h = pad + 16 * S + S * 4 + big + S * 2 + subSize + S * 10 + bh + S * 6 + F + pad;
  const x = vw / 2 - w / 2; let y = vh / 2 - h / 2;
  panel(x, y, w, h); y += pad;
  icon('coin', Math.floor(t / 140) % 6, 0, vw / 2 - 8 * S, y); y += 16 * S + S * 4;
  text('PURRL VALLEY', vw / 2, y, { align: 'center', size: big, color: '#a2401f' }); y += big + S * 2;
  text(sub, vw / 2, y, { align: 'center', size: subSize }); y += subSize + S * 10;
  const bw = Math.min(w - pad * 2, 6 * 16 * S);
  button(vw / 2 - bw / 2, y, bw, bh, 'Play', () => { ui.title = false; }, { go: true }); y += bh + S * 6;
  text('Art by EmanuelleDev', vw / 2, y, { align: 'center', size: Math.round(F * .75), color: '#8a6a4a' });
}
function drawToast(now) {
  if (!ui.toast || now - ui.toastAt > 3200) return;
  const w = Math.min(vw - S * 8, tw(ui.toast) + S * 28), h = F + S * 20;
  panel(vw / 2 - w / 2, vh * .62, w, h); text(ui.toast, vw / 2, vh * .62 + (h - F) / 2 - S, { align: 'center' });
}

// ================= frame =================
const keys = new Set();
let ready = false, last = performance.now();
function frame(t) {
  const dt = Math.min(.05, (t - last) / 1000); last = t;
  if (ready) stepPlayer(dt);
  easeZoom(dt);
  if (cam.follow) { cam.x += (player.x - cam.x) * Math.min(1, dt * 6); cam.y += (player.y - cam.y) * Math.min(1, dt * 6); }
  clampCam();
  const now = Date.now(), sw = vw / cam.z, sh = vh / cam.z, L = cam.x - sw / 2, T = cam.y - sh / 2;
  hits = []; blocks = [];
  cx.setTransform(dpr, 0, 0, dpr, 0, 0); cx.imageSmoothingEnabled = false;
  cx.fillStyle = '#3f8a3a'; cx.fillRect(0, 0, vw, vh);
  if (ready) {
    cx.drawImage(world, L, T, sw, sh, 0, 0, vw, vh);
    cx.setTransform(dpr * cam.z, 0, 0, dpr * cam.z, -L * cam.z * dpr, -T * cam.z * dpr);
    const lots = PLOTS.filter(([x, y]) => x * TS + LOT * TS > L && x * TS < L + sw && y * TS + LOT * TS > T - 64 && y * TS < T + sh);
    let drewPlayer = false;
    for (const [x, y] of lots) { if (!drewPlayer && (y + LOT) * TS > player.y + 40) { drawPlayer(cx, t); drewPlayer = true; } drawLot(cx, key(x, y), now); }
    const fx = (PLAZA[0] + 10.5) * TS - 24, fy = (PLAZA[1] + 10.5) * TS - 40;
    if (!drewPlayer && player.y < fy + 56) { drawPlayer(cx, t); drewPlayer = true; }
    spr(cx, 'fountain', (Math.floor(t / 160) % 4) * 48, 0, 48, 64, fx, fy);
    if (!drewPlayer) drawPlayer(cx, t);
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const box = (k, col, w) => { const [x, y] = k.split('_').map(Number), sx = (x * TS - cam.x) * cam.z + vw / 2, sy = (y * TS - cam.y) * cam.z + vh / 2, s = LOT * TS * cam.z; cx.strokeStyle = col; cx.lineWidth = w; cx.strokeRect(sx + w / 2, sy + w / 2, s - w, s - w); };
    if (hover && hover !== sel) box(hover, 'rgba(255,243,223,.8)', 2);
    if (sel) { box(sel, '#3b1f12', 5); box(sel, Math.floor(t / 380) % 2 ? '#fff3df' : '#f2c14e', 3); }
    if (ui.title) drawTitle(t); else { drawHUD(now); drawLotCard(now); drawModal(); drawWindow(); drawToast(t); }
  }
  requestAnimationFrame(frame);
}

// ================= input =================
const ptrs = new Map(); let drag = null, pinch = null;
const inside = (r, x, y) => x >= r[0] && y >= r[1] && x < r[0] + r[2] && y < r[1] + r[3];
function hitAt(x, y) { for (let i = hits.length - 1; i >= 0; i--) { const h = hits[i]; if (x >= h.x && y >= h.y && x < h.x + h.w && y < h.y + h.h) return h; } return null; }
cv.addEventListener('pointerdown', (e) => {
  const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  cv.setPointerCapture(e.pointerId); mouse.x = x; mouse.y = y; mouse.down = true; cv.focus();
  if (hitAt(x, y) || blocks.some((b) => inside(b, x, y))) return;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 1) drag = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y, moved: false };
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: cam.z }; drag = null; }
});
cv.addEventListener('pointermove', (e) => {
  const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top; mouse.x = x; mouse.y = y;
  if (ptrs.has(e.pointerId)) ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && ptrs.size === 2) { const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y); zoomAt(pinch.z * d / pinch.d / cam.z, (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top); return; }
  if (drag) { const dx = e.clientX - drag.x, dy = e.clientY - drag.y; if (Math.abs(dx) + Math.abs(dy) > 6) { drag.moved = true; cam.follow = false; } if (drag.moved) { cam.x = drag.cx - dx / cam.z; cam.y = drag.cy - dy / cam.z; clampCam(); } }
  const overUI = hitAt(x, y) || blocks.some((b) => inside(b, x, y));
  hover = !overUI && e.pointerType === 'mouse' ? lotOfPx(...toWorld(x, y)) : null;
  cv.style.cursor = drag && drag.moved ? 'grabbing' : hitAt(x, y) && hitAt(x, y).fn ? 'pointer' : overUI ? 'default' : 'grab';
});
function endPtr(e) {
  const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top; mouse.down = false;
  if (!ptrs.has(e.pointerId)) { const h = hitAt(x, y); if (h && h.fn && e.type === 'pointerup') h.fn({ x, y }); return; }
  if (drag && !drag.moved && ptrs.size === 1 && e.type === 'pointerup') {
    const [wx, wy] = toWorld(x, y), k = lotOfPx(wx, wy);
    sel = k; ui.win = null; cam.follow = true;
    if (k) { const [lx, ly] = k.split('_').map(Number); player.tx = (lx + 5) * TS; player.ty = (ly + LOT + .4) * TS; }
    else if (walkable(wx, wy)) { player.tx = wx; player.ty = wy; }
  }
  ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null; if (!ptrs.size) drag = null; cv.style.cursor = 'grab';
}
cv.addEventListener('pointerup', endPtr); cv.addEventListener('pointercancel', endPtr);
cv.addEventListener('pointerleave', () => { hover = null; mouse.x = mouse.y = -1; });
cv.addEventListener('wheel', (e) => {
  e.preventDefault(); if (ui.title) return;
  const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  if (ui.win || blocks.some((b) => inside(b, x, y))) return;
  const dy = e.deltaY * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? vh : 1);
  const f = Math.exp(-Math.max(-240, Math.min(240, dy)) * (e.ctrlKey ? .01 : .0018));
  cam.follow = false; zoomTo(f, x, y); // zoom toward the cursor; walking re-centres on the player
}, { passive: false });
const MOVE = ['w', 'a', 's', 'd', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Shift'];
window.addEventListener('keydown', (e) => { const k = e.key.length === 1 ? e.key.toLowerCase() : e.key; if (MOVE.includes(k)) { keys.add(k); if (k.startsWith('Arrow')) e.preventDefault(); } if (k === '+' || k === '=') zoomTo(1.25, vw / 2, vh / 2); if (k === '-') zoomTo(.8, vw / 2, vh / 2); if (k === 'Escape') { sel = null; ui.win = null; } if (k === 'Enter') ui.title = false; });
window.addEventListener('keyup', (e) => keys.delete(e.key.length === 1 ? e.key.toLowerCase() : e.key));
window.addEventListener('blur', () => keys.clear());

// ================= actions (shared database) =================
function swapOut(rin, rout, amt) { const a = amt * (1 - SWAP_FEE); return rout * a / (rin + a); }
async function saveFarm(f) { await db.doc('farms/' + me).set(f); farms[me] = f; }
const fail = (m) => { const e = new Error(m); e.userMsg = m; throw e; };
async function act(fn) {
  if (busy) return;
  if (!db || !me) { toast('Sign in to play.'); return; }
  busy = true;
  try { await fn(); } catch (e) { toast(e && e.userMsg ? e.userMsg : 'Could not save. Try again in a moment.'); console.error(e); }
  busy = false;
}
async function lease(ref) { for (let i = 0; i < 6; i++) { const r = await ref.acquire({ holder: me, ttlMs: 4000 }); if (r.acquired) return; await new Promise((ok) => setTimeout(ok, 400 + Math.random() * 400)); } fail('Someone else is trading. Try again shortly.'); }
const actions = {
  start: () => act(async () => { const now = Date.now(); await saveFarm({ purr: START.purr, usdt: START.usdt, pending: 0, accrueAt: now, lastClaim: 0, earned: 0, inv: {}, plots: {}, createdAt: now }); toast('Starter pack claimed. Tap a plot with a wooden sign.'); }),
  buyLand: () => act(async () => {
    const k = sel, pr = landPrice(), f = accrued(myFarm());
    if (!(k in PLOT_INDEX)) fail('This plot is not for sale.'); if (f.purr < pr) fail('Not enough PURR.');
    const ref = db.doc('land/' + k); await lease(ref);
    const cur = await ref.get(); if (cur.exists && cur.data().owner) fail('Someone just bought this plot.');
    await ref.set({ owner: me, at: Date.now() }); land[k] = { owner: me };
    f.purr -= pr; f.plots[k] = { kind: 'empty' }; await saveFarm(f); toast('Bought plot #' + lotNo(k) + ' for ' + fmt(pr, 0) + ' PURR.');
  }),
  buy: (d) => act(async () => { const q = +d.qty, f = accrued(myFarm()), pr = CROPS[d.item] ? CROPS[d.item].seed : MATS[d.item].price; if (f.purr < pr * q) fail('Not enough PURR.'); f.purr -= pr * q; f.inv[d.item] = (f.inv[d.item] || 0) + q; await saveFarm(f); toast(`+${q} ${CROPS[d.item] ? CROPS[d.item].name + ' seeds' : MATS[d.item].name}`); }),
  build: (d) => act(async () => {
    const k = d.plot, f = accrued(myFarm()), now = Date.now(), H = HOUSE[d.level];
    if (!land[k] || land[k].owner !== me) fail('Pick one of your plots first.');
    const p = f.plots[k] || { kind: 'empty' }, cur = p.kind === 'house' ? p.level : 0;
    if (p.kind === 'crop') fail('Harvest this plot first.'); if (building(p, now)) fail('Still under construction.');
    if (!H || d.level !== cur + 1) fail('Build the houses in order.'); if (!hasCost(f, H.cost)) fail('Not enough wood or stone.');
    f.inv.wood -= H.cost.wood; f.inv.stone -= H.cost.stone;
    f.plots[k] = { kind: 'house', level: d.level, prev: cur, startAt: now, doneAt: now + H.time };
    await saveFarm(f); sel = k; ui.win = null; toast(`Construction started: ${H.name}, ready in ${H.time / 60e3} min.`);
  }),
  buyMissing: (d) => act(async () => { const f = accrued(myFarm()), m = missing(f, HOUSE[d.level].cost), c = missingCost(m); if (!c) return; if (f.purr < c) fail('Not enough PURR.'); f.purr -= c; f.inv.wood = (f.inv.wood || 0) + m.wood; f.inv.stone = (f.inv.stone || 0) + m.stone; await saveFarm(f); toast(`Bought ${m.wood} wood and ${m.stone} stone.`); }),
  upgrade: () => { openBuild(sel); },
  plant: (d) => act(async () => { const f = accrued(myFarm()); if (!(f.inv[d.crop] > 0)) fail('Out of seeds.'); f.inv[d.crop] -= 1; f.plots[sel] = { kind: 'crop', crop: d.crop, plantedAt: Date.now() }; await saveFarm(f); }),
  harvest: () => act(async () => { const f = accrued(myFarm()), p = f.plots[sel], c = CROPS[p.crop]; if (Date.now() - p.plantedAt < c.grow) fail('Not ready yet.'); f.pending += c.yield; f.plots[sel] = { kind: 'empty' }; await saveFarm(f); toast('+' + c.yield + ' PURR added to storage.'); }),
  claim: () => act(async () => { const f = accrued(myFarm()), now = Date.now(); if (now - (f.lastClaim || 0) < CLAIM_CD) fail('Claim is not ready yet.'); if (f.pending < .01) fail('Storage is empty.'); const got = f.pending * (1 - CLAIM_FEE); f.purr += got; f.earned = (f.earned || 0) + got; f.pending = 0; f.lastClaim = now; await saveFarm(f); toast('Claimed ' + fmt(got, 2) + ' PURR.'); }),
};
function swap(dir, v) {
  v = Math.floor(v * 100) / 100; if (!(v > 0)) return;
  return act(async () => {
    const f = accrued(myFarm());
    if (dir === 'sell' && f.purr < v) fail('Not enough PURR.'); if (dir === 'buy' && f.usdt < v) fail('Not enough USDT.');
    const ref = db.doc('market/pool'); await lease(ref);
    const s = await ref.get(), p = s.exists ? clone(s.data()) : { ...POOL0, hist: [] }; let out;
    if (dir === 'sell') { out = swapOut(p.purr, p.usdt, v); p.purr += v; p.usdt -= out; f.purr -= v; f.usdt += out; }
    else { out = swapOut(p.usdt, p.purr, v); p.usdt += v; p.purr -= out; f.usdt -= v; f.purr += out; }
    p.hist = [...(p.hist || []), { t: Date.now(), p: p.usdt / p.purr }].slice(-60);
    await ref.set(p); pool = p; await saveFarm(f);
    toast(dir === 'sell' ? `Sold ${fmt(v, 2)} PURR for ${fmt(out, 2)} USDT` : `Bought ${fmt(out, 2)} PURR for ${fmt(v, 2)} USDT`);
  });
}

// ================= boot =================
new ResizeObserver(resize).observe(cv); resize();
requestAnimationFrame(frame);
atlasReady.then(() => { paintWorld(); ready = true; cam.x = player.x; cam.y = player.y; cam.z = 3; clampCam(); });
(async () => {
  if (!window.claude) { signedIn = false; return; }
  [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
  if (user) { me = await user.id(); canWrite = await user.can('data.write'); }
  signedIn = !!(db && me); if (!signedIn) { db = null; return; }
  const refreshNames = async () => { const ids = Object.keys(farms); if (!user || !ids.length) return; try { const ps = await user.profiles(ids); for (const id of ids) names[id] = ps[id].name; } catch (e) {} };
  db.collection('land').onSnapshot((s) => { const n = {}; s.docs.forEach((d) => { const v = d.data(); if (v && v.owner) n[d.id] = v; }); land = n; }, (e) => console.error(e));
  db.collection('farms').onSnapshot((s) => { const n = {}; s.docs.forEach((d) => (n[d.id] = d.data())); farms = n; refreshNames(); }, (e) => console.error(e));
  db.doc('market/pool').onSnapshot((s) => { pool = s.exists ? s.data() : null; }, (e) => console.error(e));
})();
</script>
