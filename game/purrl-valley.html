<script>
'use strict';
// ================= rules (play money) =================
const START = { purr: 500, usdt: 100 };
const LAND_BASE = 100, LAND_STEP = 2, BULK_OFF = 0.1; // whole-district purchases get 10% off
const CLAIM_CD = 10 * 60 * 1000, CLAIM_FEE = 0.05;
const POOL0 = { purr: 100000, usdt: 10000 }, SWAP_FEE = 0.003;
// crops: row on the Spring Crops sheet; stages are columns 0-5, the harvested item is column 7
const CROPS = {
  strawberry:  { name: 'Strawberry',  row: 1,  grow: 1 * 60e3,  yield: 9,   seed: 6 },
  carrot:      { name: 'Carrot',   row: 9,  grow: 2 * 60e3,  yield: 16,  seed: 10 },
  potato:      { name: 'Potato', row: 5, grow: 4 * 60e3,  yield: 30,  seed: 18 },
  cabbage:     { name: 'Cabbage',  row: 15, grow: 8 * 60e3,  yield: 52,  seed: 30 },
  cauliflower: { name: 'Cauliflower',   row: 17, grow: 15 * 60e3, yield: 105, seed: 60 },
};
// animals live in a field and give produce every cycle; a pen holds a small herd
const ANIMALS = {
  chickens: { name: 'Chickens', spr: 'chickens', size: 16, price: 40,  cycle: 3 * 60e3,  yield: 9,  product: 'eggs' },
  sheep:    { name: 'Sheep',    spr: 'sheep',    size: 32, price: 90,  cycle: 6 * 60e3,  yield: 22, product: 'wool' },
  pig:      { name: 'Pigs',     spr: 'pig',      size: 32, price: 160, cycle: 10 * 60e3, yield: 40, product: 'truffles' },
  cow:      { name: 'Cows',     spr: 'cow',      size: 32, price: 300, cycle: 20 * 60e3, yield: 85, product: 'milk' },
};
const MATS = { wood: { name: 'Wood', price: 8 }, stone: { name: 'Stone', price: 12 } };
const HOUSE = [null,
  { name: 'Cottage',   rate: 30,  cost: { wood: 10, stone: 8 },  time: 2 * 60e3,  spr: 'house1' },
  { name: 'Farmhouse', rate: 60,  cost: { wood: 20, stone: 16 }, time: 5 * 60e3,  spr: 'house2' },
  { name: 'Manor',     rate: 100, cost: { wood: 40, stone: 30 }, time: 10 * 60e3, spr: 'house3' },
];

// ================= state =================
let db = null, user = null, me = null, canWrite = null, signedIn = null;
let land = {}, farms = {}, pool = null, names = {};
let sel = null, busy = false, hover = null;
const ui = { win: null, bplot: null, dist: -1, sub: null, afield: 0, seed: 'strawberry', toast: null, toastAt: 0, title: true };
const fmt = (n, d = 1) => Number(n).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const mins = (ms) => { const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const key = (x, y) => x + '_' + y;
const clone = (o) => JSON.parse(JSON.stringify(o));
function toast(m) { ui.toast = m; ui.toastAt = performance.now(); }
const myFarm = () => (me && farms[me]) || null;
const soldCount = () => Object.keys(land).filter((k) => k in PLOT_INDEX).length;
const landPrice = () => LAND_BASE + LAND_STEP * soldCount();
const price = () => { const p = pool || POOL0; return p.usdt / p.purr; };
const building = (h, now = Date.now()) => !!h && !!h.doneAt && now < h.doneAt;
const newPlot = () => ({ house: null, fields: [null, null, null, null] });
function plotOf(f, k) { const p = f && f.plots && f.plots[k]; return { house: (p && p.house) || null, fields: [0, 1, 2, 3].map((i) => (p && p.fields && p.fields[i]) || null) }; }
const lvlAt = (p, t) => (building(p, t) ? p.prev || 0 : p.level);
function houseRate(f, now = Date.now()) { let r = 0; for (const p of Object.values(f.plots || {})) { const h = p && p.house; if (h && lvlAt(h, now)) r += HOUSE[lvlAt(h, now)].rate; } return r; }
function pendingNow(f, now = Date.now()) {
  const a = Math.min(now, f.accrueAt || now); let e = 0;
  for (const q of Object.values(f.plots || {})) {
    const p = q && q.house; if (!p) continue;
    const d = p.doneAt || 0, r0 = p.prev ? HOUSE[p.prev].rate : 0, r1 = HOUSE[p.level].rate;
    e += now <= d ? r0 * (now - a) : a >= d ? r1 * (now - a) : r0 * (d - a) + r1 * (now - d);
  }
  return (f.pending || 0) + e / 3600e3;
}
const myPlots = () => Object.keys(land).filter((k) => land[k].owner === me).sort((a, b) => PLOT_INDEX[a] - PLOT_INDEX[b]);
function buildTarget() { const ks = myPlots(); return ks.includes(ui.bplot) ? ui.bplot : ks.includes(sel) ? sel : ks.find((k) => !plotOf(myFarm(), k).house) || ks[0] || null; }
const missing = (f, c) => ({ wood: Math.max(0, c.wood - ((f.inv || {}).wood || 0)), stone: Math.max(0, c.stone - ((f.inv || {}).stone || 0)) });
const missingCost = (m) => m.wood * MATS.wood.price + m.stone * MATS.stone.price;
function openBuild(k) { ui.bplot = k || null; ui.win = 'build'; }
function accrued(f) { const g = clone(f), now = Date.now(); g.pending = pendingNow(f, now); g.accrueAt = now; g.inv = g.inv || {}; g.plots = g.plots || {}; return g; }
const hasCost = (f, c) => ((f.inv || {}).wood || 0) >= c.wood && ((f.inv || {}).stone || 0) >= c.stone;

cv.addEventListener('pointermove', (e) => {

});
function endPtr(e) {

    sel = k; ui.sub = k ? subOfPx(k, wx, wy) : null; ui.win = null; ui.dist = -1; cam.follow = true;

cv.addEventListener('pointerup', endPtr); cv.addEventListener('pointercancel', endPtr);
cv.addEventListener('pointerleave', () => { hover = null; mouse.x = mouse.y = -1; });
cv.addEventListener('wheel', (e) => {
  e.preventDefault(); if (ui.title) return;
  const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  if (ui.win || blocks.some((b) => inside(b, x, y))) return;
  const dy = e.deltaY * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? vh : 1);
  const f = Math.exp(-Math.max(-240, Math.min(240, dy)) * (e.ctrlKey ? .01 : .0018));

}, { passive: false });
const MOVE = ['w', 'a', 's', 'd', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Shift'];
window.addEventListener('keydown', (e) => { const k = e.key.length === 1 ? e.key.toLowerCase() : e.key; if (MOVE.includes(k)) { keys.add(k); if (k.startsWith('Arrow')) e.preventDefault(); } if (k === '+' || k === '=') zoomTo(1.25, vw / 2, vh / 2); if (k === '-') zoomTo(.8, vw / 2, vh / 2); if (k === 'Escape') { sel = null; ui.win = null; } if (k === 'Enter' && ui.title) startPlay(); });
window.addEventListener('keyup', (e) => keys.delete(e.key.length === 1 ? e.key.toLowerCase() : e.key));
window.addEventListener('blur', () => keys.clear());

// ================= actions (shared database) =================
function swapOut(rin, rout, amt) { const a = amt * (1 - SWAP_FEE); return rout * a / (rin + a); }
async function saveFarm(f) { await db.doc('farms/' + me).set(f); farms[me] = f; }
const fail = (m) => { const e = new Error(m); e.userMsg = m; throw e; };
async function act(fn) {
  if (busy) return;
  if (!db || !me) { toast('Sign in to play.'); return; }
  busy = true;
  try { await fn(); } catch (e) { toast(e && e.userMsg ? e.userMsg : 'Could not save. Try again in a moment.'); console.error(e); }
  busy = false;
}
async function lease(ref) { for (let i = 0; i < 6; i++) { const r = await ref.acquire({ holder: me, ttlMs: 4000 }); if (r.acquired) return; await new Promise((ok) => setTimeout(ok, 400 + Math.random() * 400)); } fail('Someone else is trading. Try again shortly.'); }
const actions = {
  start: () => act(async () => { const now = Date.now(); await saveFarm({ purr: START.purr, usdt: START.usdt, pending: 0, accrueAt: now, lastClaim: 0, earned: 0, inv: {}, plots: {}, createdAt: now }); toast('Starter pack claimed. Tap a plot with a wooden sign.'); }),
  buyDistrict: (d) => act(async () => {
    const D = DIST[d.d], free = D.plots.map(pkey).filter((k) => !land[k]), f = accrued(myFarm()), pr = districtPrice(d.d);
    if (!free.length) fail('No free plots left in ' + D.name + '.'); if (f.purr < pr) fail('Not enough PURR.');
    const s0 = soldCount(); let got = 0, paid = 0;
    toast(`Buying ${free.length} plots in ${D.name}...`);
    try {
      for (let i = 0; i < free.length; i += 8) await Promise.all(free.slice(i, i + 8).map(async (k) => {
        const ref = db.doc('land/' + k), l = await ref.acquire({ holder: me, ttlMs: 6000 }); if (!l.acquired) return;
        const cur = await ref.get(); if (cur.exists && cur.data().owner) return;
        await ref.set({ owner: me, at: Date.now() }); land[k] = { owner: me }; f.plots[k] = newPlot();
        paid += (LAND_BASE + LAND_STEP * (s0 + got)) * (1 - BULK_OFF); got++;
      }));
    } finally { f.purr -= Math.round(paid); if (got) await saveFarm(f); }
    toast(got === free.length ? `${D.name} is yours: ${got} plots for ${fmt(Math.round(paid), 0)} PURR.` : `Bought ${got} of ${free.length} plots. Others were taken first.`);
  }),
  buyLand: () => act(async () => {
    const k = sel, pr = landPrice(), f = accrued(myFarm());
    if (!(k in PLOT_INDEX)) fail('This plot is not for sale.'); if (f.purr < pr) fail('Not enough PURR.');
    const ref = db.doc('land/' + k); await lease(ref);
    const cur = await ref.get(); if (cur.exists && cur.data().owner) fail('Someone just bought this plot.');
    await ref.set({ owner: me, at: Date.now() }); land[k] = { owner: me };
    f.purr -= pr; f.plots[k] = newPlot(); await saveFarm(f); toast('Bought plot #' + lotNo(k) + ' for ' + fmt(pr, 0) + ' PURR.');
  }),
  buy: (d) => act(async () => { const q = +d.qty, f = accrued(myFarm()), pr = CROPS[d.item] ? CROPS[d.item].seed : MATS[d.item].price; if (f.purr < pr * q) fail('Not enough PURR.'); f.purr -= pr * q; f.inv[d.item] = (f.inv[d.item] || 0) + q; await saveFarm(f); toast(`+${q} ${CROPS[d.item] ? CROPS[d.item].name + ' seeds' : MATS[d.item].name}`); }),
  build: (d) => act(async () => {
    const k = d.plot, f = accrued(myFarm()), now = Date.now(), H = HOUSE[d.level];
    if (!land[k] || land[k].owner !== me) fail('Pick one of your plots first.');
    const pl = plotOf(f, k), p = pl.house, cur = p ? p.level : 0;
    if (building(p, now)) fail('Still under construction.');
    if (!H || d.level !== cur + 1) fail('Build the houses in order.'); if (!hasCost(f, H.cost)) fail('Not enough wood or stone.');
    f.inv.wood -= H.cost.wood; f.inv.stone -= H.cost.stone;
    pl.house = { level: d.level, prev: cur, startAt: now, doneAt: now + H.time }; f.plots[k] = pl;
    await saveFarm(f); sel = k; ui.win = null; toast(`Construction started: ${H.name}, ready in ${H.time / 60e3} min.`);
  }),
  buyMissing: (d) => act(async () => { const f = accrued(myFarm()), m = missing(f, HOUSE[d.level].cost), c = missingCost(m); if (!c) return; if (f.purr < c) fail('Not enough PURR.'); f.purr -= c; f.inv.wood = (f.inv.wood || 0) + m.wood; f.inv.stone = (f.inv.stone || 0) + m.stone; await saveFarm(f); toast(`Bought ${m.wood} wood and ${m.stone} stone.`); }),
  upgrade: () => { openBuild(sel); },
  plant: (d) => act(async () => { const f = accrued(myFarm()), pl = plotOf(f, d.k); if (pl.fields[d.i]) fail('This field is in use.'); if (!(f.inv[d.crop] > 0)) fail('Out of seeds.'); f.inv[d.crop] -= 1; pl.fields[d.i] = { kind: 'crop', crop: d.crop, plantedAt: Date.now() }; f.plots[d.k] = pl; await saveFarm(f); }),
  harvest: (d) => act(async () => { const f = accrued(myFarm()), pl = plotOf(f, d.k), s = pl.fields[d.i]; if (!s || s.kind !== 'crop') return; const c = CROPS[s.crop]; if (Date.now() - s.plantedAt < c.grow) fail('Not ready yet.'); f.pending += c.yield; pl.fields[d.i] = null; f.plots[d.k] = pl; await saveFarm(f); toast('+' + c.yield + ' PURR added to storage.'); }),
  buyAnimal: (d) => act(async () => { const f = accrued(myFarm()), pl = plotOf(f, d.k), a = ANIMALS[d.animal]; if (pl.fields[d.i]) fail('This field is in use.'); if (f.purr < a.price) fail('Not enough PURR.'); f.purr -= a.price; pl.fields[d.i] = { kind: 'animal', animal: d.animal, since: Date.now() }; f.plots[d.k] = pl; await saveFarm(f); ui.win = null; toast(`${a.name} moved in. First ${a.product} in ${a.cycle / 60e3} min.`); }),
  collect: (d) => act(async () => {
    const f = accrued(myFarm()), pl = plotOf(f, d.k), s = pl.fields[d.i], now = Date.now(); if (!s || s.kind !== 'animal') return;
    const a = ANIMALS[s.animal], n = Math.min(3, Math.floor((now - s.since) / a.cycle)); if (!n) fail('Not ready yet.');
    f.pending += a.yield * n; s.since = n === 3 ? now : s.since + n * a.cycle; f.plots[d.k] = pl; await saveFarm(f); toast(`+${a.yield * n} PURR from ${a.product}.`);
  }),
  release: (d) => act(async () => { const f = accrued(myFarm()), pl = plotOf(f, d.k); pl.fields[d.i] = null; f.plots[d.k] = pl; await saveFarm(f); }),
  claim: () => act(async () => { const f = accrued(myFarm()), now = Date.now(); if (now - (f.lastClaim || 0) < CLAIM_CD) fail('Claim is not ready yet.'); if (f.pending < .01) fail('Storage is empty.'); const got = f.pending * (1 - CLAIM_FEE); f.purr += got; f.earned = (f.earned || 0) + got; f.pending = 0; f.lastClaim = now; await saveFarm(f); toast('Claimed ' + fmt(got, 2) + ' PURR.'); }),
};
function swap(dir, v) {
  v = Math.floor(v * 100) / 100; if (!(v > 0)) return;
  return act(async () => {
    const f = accrued(myFarm());
    if (dir === 'sell' && f.purr < v) fail('Not enough PURR.'); if (dir === 'buy' && f.usdt < v) fail('Not enough USDT.');
    const ref = db.doc('market/pool'); await lease(ref);
    const s = await ref.get(), p = s.exists ? clone(s.data()) : { ...POOL0, hist: [] }; let out;
    if (dir === 'sell') { out = swapOut(p.purr, p.usdt, v); p.purr += v; p.usdt -= out; f.purr -= v; f.usdt += out; }
    else { out = swapOut(p.usdt, p.purr, v); p.usdt += v; p.purr -= out; f.usdt -= v; f.purr += out; }
    p.hist = [...(p.hist || []), { t: Date.now(), p: p.usdt / p.purr }].slice(-60);
    await ref.set(p); pool = p; await saveFarm(f);
    toast(dir === 'sell' ? `Sold ${fmt(v, 2)} PURR for ${fmt(out, 2)} USDT` : `Bought ${fmt(out, 2)} PURR for ${fmt(v, 2)} USDT`);
  });
}

// ================= boot =================
new ResizeObserver(resize).observe(cv); resize();
requestAnimationFrame(frame);
atlasReady.then(() => { prepareWorld(); ready = true; cam.follow = false; cam.x = WPXW / 2; cam.y = WPXH / 2; cam.z = cam.tz = 0; clampCam(); });
(async () => {
  if (!window.claude) { signedIn = false; return; }
  [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
  if (user) { me = await user.id(); canWrite = await user.can('data.write'); }
  signedIn = !!(db && me); if (!signedIn) { db = null; return; }
  const refreshNames = async () => { const ids = Object.keys(farms); if (!user || !ids.length) return; try { const ps = await user.profiles(ids); for (const id of ids) names[id] = ps[id].name; } catch (e) {} };
  db.collection('land').onSnapshot((s) => { const n = {}; s.docs.forEach((d) => { const v = d.data(); if (v && v.owner && d.id in PLOT_INDEX) n[d.id] = v; }); land = n; }, (e) => console.error(e));
  db.collection('farms').onSnapshot((s) => { const n = {}; s.docs.forEach((d) => { const v = d.data(); if (v && v.plots) for (const k of Object.keys(v.plots)) if (!(k in PLOT_INDEX)) delete v.plots[k]; n[d.id] = v; }); farms = n; refreshNames(); }, (e) => console.error(e));
  db.doc('market/pool').onSnapshot((s) => { pool = s.exists ? s.data() : null; }, (e) => console.error(e));
})();
</script>
